spring.application.name=marketplace-test

# Banco em memória (modo PostgreSQL) para os testes de integração.
spring.datasource.url=jdbc:h2:mem:marketplace;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
app.database.create-if-not-exists=false

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

app.jwt.secret=chave-de-teste-com-pelo-menos-32-bytes-para-hmac-sha
app.jwt.expiration=3600000
